<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notas de Versão - Whats Link+</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <link rel="stylesheet" href="styles.css">
    <style>
        /* Release Notes Specific Styles */
        .page-wrapper {
            padding-top: var(--header-height);
        }

        .release-header {
            text-align: center;
            padding: var(--space-12) 0;
            background: linear-gradient(180deg, rgba(37, 211, 102, 0.05) 0%, transparent 100%);
        }

        .timeline {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            padding: var(--space-8) var(--space-4);
        }

        /* Vertical Line */
        .timeline::before {
            content: '';
            position: absolute;
            top: 0;
            left: var(--space-8);
            height: 100%;
            width: 2px;
            background: linear-gradient(180deg, var(--whatsapp-primary) 0%, transparent 100%);
        }

        .release-card {
            background-color: var(--neutral-800);
            border: 1px solid var(--neutral-700);
            border-radius: var(--space-4);
            padding: var(--space-6);
            margin-bottom: var(--space-8);
            margin-left: var(--space-12);
            position: relative;
            transition: all 0.3s ease;
        }

        .release-card:hover {
            border-color: var(--whatsapp-primary);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            transform: translateY(-2px);
        }

        /* Dot on timeline */
        .release-card::before {
            content: '';
            position: absolute;
            top: var(--space-6);
            left: calc(var(--space-12) * -1 - 5px);
            /* Adjust based on margin-left */
            width: 12px;
            height: 12px;
            background-color: var(--neutral-900);
            border: 2px solid var(--whatsapp-primary);
            border-radius: 50%;
            z-index: 1;
        }

        .release-card:first-child::before {
            background-color: var(--whatsapp-primary);
            box-shadow: 0 0 10px var(--whatsapp-primary);
        }

        .release-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-4);
            border-bottom: 1px solid var(--neutral-700);
            padding-bottom: var(--space-4);
        }

        .release-version {
            font-family: var(--font-mono);
            font-size: 1.1rem;
            color: var(--whatsapp-primary);
            font-weight: 700;
        }

        .release-date {
            color: var(--neutral-400);
            font-size: 0.9rem;
        }

        /* Markdown Content Styles */
        .release-content h1,
        .release-content h2 {
            font-size: 1.25rem;
            color: var(--white);
            margin-top: 1rem;
            margin-bottom: 0.5rem;
        }

        .release-content h3 {
            font-size: 1.1rem;
            color: var(--neutral-200);
            margin-top: 1rem;
        }

        .release-content ul {
            padding-left: 1.2rem;
            margin-bottom: 1rem;
            color: var(--neutral-300);
        }

        .release-content li {
            margin-bottom: 0.25rem;
        }

        .release-content p {
            margin-bottom: 1rem;
            color: var(--neutral-300);
        }

        .release-content code {
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 4px;
            border-radius: 3px;
            font-family: var(--font-mono);
            font-size: 0.85em;
        }

        /* Loading State */
        .loading-skeleton {
            height: 200px;
            background: linear-gradient(90deg, var(--neutral-800) 25%, var(--neutral-700) 50%, var(--neutral-800) 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: var(--space-4);
            margin-left: var(--space-12);
        }

        @keyframes loading {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        @media (max-width: 600px) {
            .timeline::before {
                left: 10px;
            }

            .release-card {
                margin-left: 30px;
            }

            .release-card::before {
                left: -26px;
            }
        }
    </style>
</head>

<body>
    <div class="noise-overlay"></div>
    <div class="page-wrapper">
        <header class="header">
            <div class="container">
                <nav class="nav">
                    <a href="index.html" class="nav__logo">
                        <img src="https://raw.githubusercontent.com/Machina-Labs-Agency/Whats-Link-Plus/d54360d75a605ba1fa1bdc5ab22a68010449572f/Assets/icons/icon128.png"
                            alt="Logo">
                        Whats Link+
                    </a>
                    <div class="nav__actions">
                        <a href="index.html" class="nav__link"><i class="ph ph-arrow-left"></i> Voltar</a>
                    </div>
                </nav>
            </div>
        </header>

        <main>
            <div class="release-header">
                <div class="container">
                    <h1 class="section-title">Notas de Versão</h1>
                    <p class="section-subtitle">Acompanhe a evolução do Whats Link+ e todas as novidades.</p>
                </div>
            </div>

            <div class="container timeline" id="timelineContainer">
                <div class="loading-skeleton"></div>
                <div class="loading-skeleton" style="margin-top: 20px"></div>
            </div>
        </main>

        <footer class="footer">
            <div class="container">
                <div class="footer__bottom">
                    <p class="footer__copyright">
                        Desenvolvido com <i class="ph-fill ph-heart"
                            style="color: var(--accent-red); vertical-align: middle;"></i> por <a
                            href="https://github.com/Machina-Labs-Agency">Machina Labs Agency</a>
                    </p>
                </div>
            </div>
        </footer>
    </div>

    <script>
        async function fetchReleaseContent(filename) {
            // Fetch raw markdown from GitHub (using Raw URL structure)
            const rawUrl = `https://raw.githubusercontent.com/Machina-Labs-Agency/Whats-Link-Plus/main/Release%20Notes/${filename}`;
            try {
                const response = await fetch(rawUrl);
                if (!response.ok) return 'Conteúdo indisponível.';
                return await response.text();
            } catch (error) {
                console.error('Error fetching markdown:', error);
                return 'Erro ao carregar notas.';
            }
        }

        async function initTimeline() {
            const container = document.getElementById('timelineContainer');

            try {
                // Fetch the JSON index
                const response = await fetch('release_notes.json');
                const notes = await response.json();

                container.innerHTML = ''; // Clear skeleton

                for (const note of notes) {
                    // Extract filename from the URL in JSON to build Raw URL
                    // URL format: .../blob/main/Release%20Notes/FILENAME.md
                    const filename = note.url.split('/').pop();

                    const markdown = await fetchReleaseContent(filename);
                    const htmlContent = marked.parse(markdown);

                    const card = document.createElement('div');
                    card.className = 'release-card';
                    card.innerHTML = `
                        <div class="release-meta">
                            <span class="release-version">Versão ${note.version}</span>
                            <span class="release-date"><i class="ph ph-calendar-blank"></i> ${note.date}</span>
                        </div>
                        <div class="release-content">
                            ${htmlContent}
                        </div>
                    `;
                    container.appendChild(card);
                }

            } catch (error) {
                container.innerHTML = `<p style="text-align:center; color: var(--accent-red)">Erro ao carregar histórico: ${error.message}</p>`;
            }
        }

        document.addEventListener('DOMContentLoaded', initTimeline);
    </script>
</body>

</html>
